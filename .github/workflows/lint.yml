name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install the lint runner
        run: python -m pip install --requirement requirements-lint.txt
      - name: Check changed files
        env:
          FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_REF: ${{ github.sha }}
        run: pre-commit run --from-ref "$FROM_REF" --to-ref "$TO_REF" --show-diff-on-failure
