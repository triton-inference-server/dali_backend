default_stages: [pre-commit, pre-push]

exclude: |-
  (?x)^(
    extern/|
    benchmarks/dali_vs_python/BM_jasper/model_repository/jasper_python/1/features\.py$|
    src/utils/cmake_config\.h$
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff check
      - id: ruff-format
        name: ruff format (check)
        args: [--check]
      - id: ruff-check
        alias: ruff-check-fix
        name: ruff check (fix)
        args: [--fix]
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-fix
        name: ruff format (fix)
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6
    hooks:
      - id: clang-format
        name: clang-format (check)
        args: [--dry-run, --Werror, --fallback-style=none, --style=file]
        files: ^src/.*\.(cc|h)$
      - id: clang-format
        alias: clang-format-fix
        name: clang-format (fix)
        args: [-i, --fallback-style=none, --style=file]
        files: ^src/.*\.(cc|h)$
        stages: [manual]
